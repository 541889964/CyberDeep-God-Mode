apply plugin: 'com.android.application'

android {
    namespace 'com.cyber.god'
    compileSdk 36

    defaultConfig {
        applicationId "com.cyber.god"
        minSdk 26
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mozilla.geckoview:geckoview-beta-arm64-v8a:149.0.20260227092902'
}
